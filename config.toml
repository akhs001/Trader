# Default settings for Trader. Updates replace this file, so do not edit it.
# To change a setting, create a file named config.local.toml next to this one
# and put only the settings you want to change in it, for example:
#
#   [market]
# The market filter: a strategy that uses it looks for long entries only while
# the S&P 500 is above its 200-day average, and for shorts only while it is
# below. Each strategy has its own `market_filter` setting. In testing, dips
# lost money when the market was below the line, but gaps did not, so the gap
# strategy ignores the filter. false here switches it off for every strategy.
filter = true
# The fund that stands for the market.
symbol = "SPY"

[plan]
# Every alert comes with a trade plan: Entry, SL, a target and an exit rule.
# Entry = the price at scan time.
# SL = just beyond the level that would prove the setup wrong, kept between
# `min_stop_atr` and `max_stop_atr` ATRs from the entry. ATR is the stock's
# average daily range. A setup without such a level names its own distance.
min_stop_atr = 1.0
max_stop_atr = 3.0
default_stop_atr = 2.0
# TP levels shown for strategies that let a winner run, as multiples of the
# risk (entry to SL). They are reference points; the exit rule ends the trade.
targets_r = [2.0, 3.0]

[signals]
# Long = buy, short = sell short. Every strategy below is described for longs;
# its short form is the same rule upside down. In testing on the S&P 500 no
# short form made money, so shorts are only looked for when you choose
# "Short only" or "Long and short" on the page.
long = true
short = true

# --- Strategies that beat a random entry in testing; on by default -----------

[signals.dip]
enabled = true
# Dip in a leader. A stock in a strong uptrend (see "leader" below) has a
# sharp two-day sell-off: RSI(2) falls below `rsi_level`.
# SL = `stop_atr` ATRs below the entry. The target (the average) is close, so
# this setup wins often and small. A wider stop wins more often but risks more
# per trade: in testing 2 ATR won 66% of trades and 3 ATR 70%.
# Exit = the first close back above the `exit_average`-day average.
rsi_level = 10
stop_atr = 2.0
market_filter = true
exit_average = 10
# Only dips in leaders. false = any stock above its 200-day average.
leaders_only = true

[signals.gap]
enabled = true
# Gap on heavy volume. The stock opens at least `gap_atr` ATRs above
# yesterday's close, trades `volume_ratio` times its 50-day average volume,
# never fills the gap and closes in the upper half of the day's range.
# SL = just below the gap day's low.
# Exit = the first close below the low of the previous `exit_low` days.
gap_atr = 1.5
volume_ratio = 2.0
exit_low = 20
market_filter = false

# --- Classic rules that did NOT beat a random entry in testing; off ----------
# They still run when you pick one by name on the page.

[signals.base_breakout]
enabled = false
# O'Neil / Minervini. A leader closes above the top of a `base_days` base
# that is at most `max_depth_pct` deep and has tightened (the last
# `tight_days` days span at most `tightness` of the base), on `volume_ratio`
# times its 50-day average volume, and is at most `max_chase_pct` past it.
# SL = below the low of the base's last days, at most `max_stop_pct` away.
# Exit = the first close below the `exit_average`-day average.
base_days = 25
tight_days = 10
tightness = 0.6
max_depth_pct = 25
max_chase_pct = 5
volume_ratio = 1.4
max_stop_pct = 8
exit_average = 20

[signals.pullback]
enabled = false
# A leader dips at least `min_depth_atr` ATRs to its 20- or 50-day average
# within `lookback_days`, then closes above the previous day's high.
# SL = below the pullback low.
# Exit = the first close below the low of the previous `exit_low` days.
lookback_days = 5
touch_pct = 1.0
min_depth_atr = 2.0
exit_low = 10

[signals.channel_breakout]
enabled = false
# The Turtles' long-term system: a close above the high of the last `days`.
# SL = `stop_atr` ATRs below the entry.
# Exit = the first close below the low of the previous `exit_low` days.
days = 55
stop_atr = 2.0
exit_low = 20

# A "leader" is a stock that passes Mark Minervini's trend template: price
# above its 50-, 150- and 200-day averages, those averages stacked in that
# order, the 200-day rising, price within 25% of its one-year high and at
# least 30% above its one-year low, and not weaker than the market over the
# last six months.
