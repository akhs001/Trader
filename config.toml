# Default settings for Trader. Updates replace this file, so do not edit it.
# To change a setting, create a file named config.local.toml next to this one
# and put only the settings you want to change in it, for example:
#
#   [plan]
#   targets_r = [1.5, 3.0]
#
#   [signals.ma_cross]
#   macd = false
#
# Settings for the watchlist scanner. All signals use daily candles; during
# market hours today's unfinished candle is included, so prices are live
# (about 15 minutes delayed).

[data]
# Where prices come from.
#   "yahoo"       Yahoo Finance, through the yfinance package. No key needed
#                 and no per-minute limit.
#   "twelvedata"  Twelve Data. Needs TWELVE_DATA_API_KEY in .env; the free
#                 plan allows 8 requests a minute.
source = "yahoo"

[schedule]
# How often the bot checks the watchlist while the US market is open.
interval_minutes = 15

[alerts]
# After a signal fires for a stock, the same signal is not emailed again
# for this many calendar days.
cooldown_days = 5

[plan]
# Every alert comes with a trade plan: Entry, SL and TP.
# Entry = the price at scan time.
# SL = just below the level that would prove the setup wrong (the pullback
# low, the breakout level, the recent low), kept between `min_stop_atr` and
# `max_stop_atr` ATRs from the entry. ATR is the stock's average daily range.
# Signals without such a level (average and MACD crosses) use `default_stop_atr`.
min_stop_atr = 1.0
max_stop_atr = 3.0
default_stop_atr = 2.0
# TP levels, as multiples of the risk (entry minus SL). [2.0, 3.0] means TP1
# is twice as far from the entry as the SL, and TP2 three times as far.
targets_r = [2.0, 3.0]

[signals]
# Which kinds of entry to look for. Long = buy, short = sell short.
# Every signal below is described for longs; its short version is the same
# rule upside down (a rally in a downtrend, a breakdown below the 20-day low,
# RSI dropping back below 70, the averages or MACD crossing down), with the SL
# above the entry and the TPs below it.
long = true
short = true

[signals.trend_continuation]
enabled = true
# A massive move, a partial retrace of it, and the first day it resumes.
# The move ("leg") is measured inside the last `leg_days` days and must be at
# least `min_leg_atr` ATRs from its start to its top, with the 20-day average
# above the 50-day above the 200-day. Lower `min_leg_atr` for more signals.
# The retrace must give back between `min_retrace_pct` and `max_retrace_pct`
# of the leg, and its low must be within the last `lookback_days` days.
# Entry = the first day the price moves above the previous day's high.
leg_days = 60
min_leg_atr = 10
min_retrace_pct = 30
max_retrace_pct = 65
lookback_days = 5

[signals.trend_pullback]
enabled = true
# Uptrend = price above the 200-day average and 50-day above 200-day.
# Pullback = within the last `lookback_days` the low came within
# `touch_pct` percent of the 20- or 50-day average, or RSI fell below `rsi_below`.
# The dip must be at least `min_depth_atr` ATRs deep, measured from the
# 20-day high. Raise it to get fewer, deeper pullbacks.
# Entry = the first day the price moves above the previous day's high.
lookback_days = 5
min_depth_atr = 2.0
touch_pct = 1.0
rsi_below = 40

[signals.breakout]
enabled = true
# Entry = price moves above the highest high of the previous `lookback_days`
# with volume at least `volume_ratio` times the 20-day average.
lookback_days = 20
volume_ratio = 1.5

[signals.oversold_bounce]
enabled = true
# Entry = RSI(14) was below `rsi_level` yesterday and is back above it today.
rsi_level = 30

[signals.ma_cross]
enabled = true
# Entry = the fast average crosses above the slow average.
fast = 20
slow = 50
# Also alert when MACD (12, 26, 9) crosses above its signal line.
macd = true
