<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trader</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --line: #e1e4e8; --text: #1b1f24; --muted: #646d78;
    --accent: #1f6feb; --accent-text: #ffffff; --up: #17803d; --down: #cf222e;
    --soft: #f0f2f5; --warn-bg: #fff4d6; --warn-text: #6b4a00; --new: #17803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #181c22; --line: #2a3038; --text: #e8ebef; --muted: #98a2ae;
      --accent: #4c8dff; --accent-text: #0b1220; --up: #4cc38a; --down: #ff7b72;
      --soft: #20262e; --warn-bg: #3a2f10; --warn-text: #f2d48a; --new: #4cc38a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 56px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
       color: var(--muted); margin: 28px 0 10px; }
  .pill { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--soft);
          color: var(--muted); white-space: nowrap; }
  .pill b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.open { background: var(--up); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .banner { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px;
            padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
  .banner.error { background: color-mix(in srgb, var(--down) 14%, var(--card)); color: var(--text); }
  code { font: 13px ui-monospace, Consolas, monospace; background: var(--soft); padding: 1px 5px; border-radius: 4px; }

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  .tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none;
         padding: 8px 14px; font-weight: 600; color: var(--muted); margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .filters { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .filters label { display: flex; align-items: center; gap: 8px; }
  .filters select { color: var(--text); padding: 5px 8px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 16px 0 0; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tile .label { font-size: 12px; color: var(--muted); }
  table.compact th, table.compact td { font-size: 13px; padding-right: 12px; }
  .tile .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 240px; }
  .chart text { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .zero { stroke: var(--muted); stroke-width: 1; }
  .chart .curve { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .cross { stroke: var(--muted); stroke-width: 1; }
  .chart .dot { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
  .tip { position: absolute; pointer-events: none; background: var(--text); color: var(--card);
         border-radius: 6px; padding: 5px 9px; font-size: 12px; white-space: nowrap;
         transform: translate(-50%, -130%); display: none; }
  .tip b { font-size: 13px; }
  .card h3 { font-size: 15px; margin: 0 0 2px; }
  .card h3 + .small { margin-bottom: 12px; }
  .notes { font-size: 13px; color: var(--muted); margin: 14px 0 0; padding-left: 18px; }
  .notes li { margin: 2px 0; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); padding: 7px 12px; }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .6; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text);
                   font-size: 16px; font-weight: 600; padding: 11px 22px; }
  button.link { border: 0; background: none; padding: 0; color: var(--accent); }
  .options { display: grid; gap: 6px; font-size: 14px; }
  .options label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .auto-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
           border-radius: 6px; padding: 2px 6px; }
  .status { margin-top: 12px; font-size: 14px; color: var(--muted); min-height: 21px; }
  .bar { height: 4px; border-radius: 2px; background: var(--soft); margin-top: 10px; overflow: hidden; display: none; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .bar.on { display: block; }

  .entry { margin-bottom: 12px; }
  .entry-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; }
  .sym { font-size: 20px; font-weight: 700; }
  .side { font-size: 12px; font-weight: 700; letter-spacing: .05em; color: #fff; padding: 2px 9px;
          border-radius: 999px; background: var(--up); align-self: center; }
  .side.short { background: var(--down); }
  @media (prefers-color-scheme: dark) { .side { color: #0b1220; } }
  .price { font-size: 16px; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }
  .small { font-size: 12px; color: var(--muted); }
  .levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 14px 0 6px; }
  .level { background: var(--soft); border-radius: 8px; padding: 8px 6px; text-align: center; }
  .level .label { font-size: 11px; font-weight: 700; letter-spacing: .05em; color: var(--muted); }
  .level .value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .level.sl .value { color: var(--down); } .level.tp .value { color: var(--up); }
  .signal { margin-top: 12px; }
  .signal .title { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
  .badge { font-size: 11px; font-weight: 600; letter-spacing: 0; text-transform: none; margin-left: 8px;
           padding: 1px 7px; border-radius: 999px; background: var(--soft); color: var(--muted); }
  .badge.new { background: color-mix(in srgb, var(--new) 16%, transparent); color: var(--new); }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .facts b { color: var(--text); font-weight: 600; }
  .entry a { font-size: 13px; color: var(--accent); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 10px 8px 0; white-space: nowrap; }
  td { padding: 9px 10px 9px 0; border-top: 1px solid var(--line); white-space: nowrap; }
  td.num, th.num { text-align: right; }
  td.sym-cell { font-weight: 700; }
  td.status-cell { white-space: normal; color: var(--muted); }
  td.status-cell.hit { color: var(--up); font-weight: 600; }
  td.status-cell.bad { color: var(--down); }
  td:last-child, th:last-child { padding-right: 0; text-align: right; }
  .remove { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 6px; }
  .remove:hover { color: var(--down); }
  form.add { display: flex; gap: 8px; margin-top: 14px; }
  input[type=text] { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
                     border-radius: 8px; padding: 7px 10px; width: 150px; text-transform: uppercase; }
  input::placeholder { text-transform: none; }
  .form-error { color: var(--down); font-size: 13px; margin-top: 6px; min-height: 20px; }
  .empty { color: var(--muted); font-size: 14px; }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Trader</h1>
    <span class="pill" id="market"></span>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" id="tabbtn-entries" data-tab="entries" role="tab">Entries</button>
    <button class="tab" id="tabbtn-backtest" data-tab="backtest" role="tab">Backtest</button>
  </nav>

  <div id="banners"></div>

  <div id="tab-entries">
  <section class="card">
    <div class="filters">
      <label>Strategy <select id="strategy"></select></label>
      <label>Direction
        <select id="direction">
          <option value="both">Long and short</option>
          <option value="long">Long only</option>
          <option value="short">Short only</option>
        </select>
      </label>
    </div>
    <div class="controls">
      <button class="primary" id="check">Check entries</button>
      <div class="options">
        <label><input type="checkbox" id="email"> <span id="email-label">Email me new entries</span></label>
        <div class="auto-row">
          <label><input type="checkbox" id="auto"> Check automatically every</label>
          <select id="interval" aria-label="Minutes between automatic checks"></select>
          <label for="auto">while the market is open</label>
        </div>
      </div>
    </div>
    <div class="bar" id="bar"><span></span></div>
    <div class="status" id="status"></div>
  </section>

  <div id="entries"></div>

  <h2>Watchlist</h2>
  <section class="card">
    <div class="table-wrap" id="watchlist"></div>
    <form class="add" id="add-form">
      <input type="text" id="add-input" placeholder="Add ticker" maxlength="15" autocomplete="off" aria-label="Ticker to add">
      <button type="submit">Add</button>
    </form>
    <div class="form-error" id="add-error"></div>
  </section>
  </div>

  <div id="tab-backtest" hidden>
    <section class="card">
      <div class="filters">
        <label>Strategy <select id="bt-strategy"></select></label>
        <label>Direction
          <select id="bt-direction">
            <option value="both">Long and short</option>
            <option value="long">Long only</option>
            <option value="short">Short only</option>
          </select>
        </label>
        <label>Stocks <select id="bt-symbol"></select></label>
        <label>Period
          <select id="bt-years">
            <option value="1">Last year</option>
            <option value="2" selected>Last 2 years</option>
            <option value="5">Last 5 years</option>
          </select>
        </label>
        <label>Take profit at
          <select id="bt-target">
            <option value="1">TP1</option>
            <option value="2">TP2</option>
          </select>
        </label>
        <label>Close after
          <select id="bt-days">
            <option value="10">10 days</option>
            <option value="20">20 days</option>
            <option value="30" selected>30 days</option>
            <option value="60">60 days</option>
          </select>
        </label>
      </div>
      <div class="controls">
        <button class="primary" id="bt-run">Run backtest</button>
      </div>
      <div class="bar" id="bt-bar"><span></span></div>
      <div class="status" id="bt-status"></div>
    </section>
    <div id="bt-results"></div>
  </div>

  <footer>
    Entry, SL and TP are calculated by fixed rules from the latest price; they are not predictions
    and not financial advice. Check the chart before trading.
    <span id="test-email-wrap"> · <button class="link" id="test-email">Send a test email</button> <span id="test-email-result"></span></span>
  </footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
let state = null;
let offline = false;
let timer = null;

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else node.setAttribute(key, value);
  }
  for (const child of children) if (child) node.append(child);
  return node;
}

async function post(path, body = {}) {
  const response = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-Trader": "1"},
    body: JSON.stringify(body),
  });
  return response.json();
}

async function refresh() {
  clearTimeout(timer);
  try {
    state = await (await fetch("/api/state")).json();
    offline = false;
  } catch (error) {
    offline = true;
  }
  render();
  // Poll quickly during a check or backtest, and often enough to show automatic checks.
  const busy = state && (state.scan.running || (state.backtest || {}).running);
  const pause = !state ? 10000 : busy ? 700 : state.auto.enabled ? 3000 : 10000;
  timer = setTimeout(refresh, pause);
}

function money(value) { return value == null ? "" : value.toFixed(2); }
function percent(value) { return value == null ? "" : (value >= 0 ? "+" : "") + value.toFixed(2) + "%"; }

function render() {
  const banners = $("banners");
  banners.replaceChildren();
  if (offline) {
    banners.append(el("div", {class: "banner error",
      text: "The Trader program is not running. Start it again (start.bat) and reload this page."}));
    $("check").disabled = true;
    return;
  }
  if (!state) return;
  const {scan, setup, market, auto, watchlist} = state;

  $("market").replaceChildren(
    el("span", {class: "dot" + (market.open ? " open" : "")}),
    el("b", {text: market.open ? "Market open" : "Market closed"}),
    document.createTextNode(" · New York " + market.time));

  // `stale` is missing when the running program predates this page.
  if (state.stale !== false) banners.append(el("div", {class: "banner error",
    text: "Trader was updated, but the old version is still running. Close the black Trader window, then double-click start.bat again."}));
  if (!setup.data) banners.append(el("div", {class: "banner", text: "Prices cannot be read yet. " + setup.data_problem}));
  if (!setup.email) banners.append(banner("Email is not set up, so entries are only shown here. To get emails, put GMAIL_ADDRESS and GMAIL_APP_PASSWORD in the ", ".env", " file, then restart Trader."));
  if (scan.error) banners.append(el("div", {class: "banner error", text: scan.error}));

  // Strategy and direction for checks
  fillStrategies($("strategy"), state.strategies || []);
  fillStrategies($("bt-strategy"), state.strategies || []);
  const selection = state.selection || {strategy: "all", direction: "both"};
  if (document.activeElement !== $("strategy")) $("strategy").value = selection.strategy;
  if (document.activeElement !== $("direction")) $("direction").value = selection.direction;
  renderBacktestControls();

  // Controls
  $("check").disabled = scan.running || !setup.data || watchlist.length === 0;
  $("check").textContent = scan.running ? "Checking…" : "Check entries";
  $("email").disabled = !setup.email;
  if (!setup.email) $("email").checked = false;
  $("email-label").textContent = setup.email ? "Email me new entries (" + setup.email_to + ")" : "Email me new entries";
  $("auto").checked = auto.enabled;
  $("auto").disabled = !setup.data;
  const select = $("interval");
  if (!select.options.length) {
    for (let minutes = auto.min || 1; minutes <= (auto.max || 15); minutes++) {
      select.append(el("option", {value: minutes, text: minutes + " min"}));
    }
  }
  if (document.activeElement !== select) select.value = auto.interval;
  select.disabled = !setup.data;
  $("test-email-wrap").style.display = setup.email ? "" : "none";

  const done = scan.results.length;
  $("bar").className = "bar" + (scan.running ? " on" : "");
  $("bar").firstElementChild.style.width = scan.total ? (100 * done / scan.total) + "%" : "0";
  const hits = scan.results.filter((r) => r.entries && r.entries.length);
  let status = "";
  if (scan.running) {
    status = scan.message || ("Checking " + (scan.current || "…") + " (" + Math.min(done + 1, scan.total) + " of " + scan.total + ")");
  } else if (scan.finished) {
    status = "Checked at " + scan.finished + " for " + selectionLabel(scan.strategy, scan.direction) + ": " + (hits.length ? plural(hits.length, "stock") + " with a possible entry" : "no entries right now") + ". " + (scan.email || "");
    if (auto.enabled && !market.open) status += " Automatic checks resume when the market opens.";
  } else if (watchlist.length === 0) {
    status = "Add a ticker to your watchlist to get started.";
  } else {
    status = "Press the button to check your " + plural(watchlist.length, "stock") + ".";
  }
  $("status").textContent = status;

  // Entries
  const entries = $("entries");
  entries.replaceChildren();
  if (hits.length) {
    entries.append(el("h2", {text: "Possible entries"}));
    for (const row of hits) for (const entry of row.entries) entries.append(entryCard(row, entry));
  }

  // Watchlist table
  const byName = Object.fromEntries(scan.results.map((r) => [r.symbol, r]));
  const wrap = $("watchlist");
  if (watchlist.length === 0) {
    wrap.replaceChildren(el("div", {class: "empty", text: "Your watchlist is empty."}));
    return;
  }
  const table = el("table", {},
    el("thead", {}, el("tr", {},
      el("th", {text: "Stock"}), el("th", {class: "num", text: "Price"}), el("th", {class: "num", text: "Today"}),
      el("th", {class: "num", text: "RSI"}), el("th", {text: "Result"}), el("th", {}))));
  const body = el("tbody");
  for (const symbol of watchlist) {
    const row = byName[symbol];
    let result = scan.running && scan.current === symbol ? "Checking…" : "Not checked yet";
    let resultClass = "status-cell";
    if (row) {
      if (row.error) { result = row.error; resultClass += " bad"; }
      else if (row.entries && row.entries.length) {
        result = row.entries.map((e) => (e.direction === "short" ? "Short: " : "Long: ") + e.signals.map((s) => s.title).join(", ")).join(" · ");
        resultClass += " hit";
      }
      else if (row.note) result = "Skipped: " + row.note;
      else result = "No entry";
    }
    const change = row && row.change_pct != null ? row.change_pct : null;
    const remove = el("button", {class: "remove", title: "Remove " + symbol, "aria-label": "Remove " + symbol, text: "×"});
    remove.addEventListener("click", async () => { await post("/api/watchlist/remove", {symbol}); refresh(); });
    body.append(el("tr", {},
      el("td", {class: "sym-cell", text: symbol}),
      el("td", {class: "num", text: row ? money(row.price) : ""}),
      el("td", {class: "num " + (change == null ? "" : change >= 0 ? "up" : "down"), text: percent(change)}),
      el("td", {class: "num", text: row && row.facts["RSI(14)"] || ""}),
      el("td", {class: resultClass, text: result}),
      el("td", {}, remove)));
  }
  table.append(body);
  wrap.replaceChildren(table);
}

// ---- strategies ------------------------------------------------------------

function fillStrategies(select, strategies) {
  if (select.options.length || !strategies.length) return;
  select.append(el("option", {value: "all", text: "All strategies"}));
  for (const strategy of strategies) select.append(el("option", {value: strategy.id, text: strategy.name}));
}

function selectionLabel(strategy, direction) {
  const found = ((state && state.strategies) || []).find((item) => item.id === strategy);
  const name = found ? found.name : "all strategies";
  return name + (direction === "long" ? ", long only" : direction === "short" ? ", short only" : "");
}

async function saveSelection() {
  await post("/api/selection", {strategy: $("strategy").value, direction: $("direction").value});
  refresh();
}

// ---- tabs --------------------------------------------------------------------

function showTab(name) {
  for (const tab of ["entries", "backtest"]) {
    $("tab-" + tab).hidden = tab !== name;
    $("tabbtn-" + tab).className = "tab" + (tab === name ? " on" : "");
    $("tabbtn-" + tab).setAttribute("aria-selected", tab === name);
  }
  try { localStorage.setItem("trader-tab", name); } catch (error) {}
  if (name === "backtest") drawCurve();
}

// ---- backtest ----------------------------------------------------------------

let backtestRun = null;     // the run whose result is on screen
let backtestResult = null;
let showAllTrades = false;

function signed(value, digits = 2) { return (value >= 0 ? "+" : "") + value.toFixed(digits); }

function renderBacktestControls() {
  const run = state.backtest || {running: false, run: 0, total: 0, done: 0};
  const symbols = $("bt-symbol");
  const wanted = ["", ...state.watchlist].join(",");
  if (symbols.dataset.list !== wanted) {
    const current = symbols.value;
    symbols.replaceChildren(el("option", {value: "", text: "Whole watchlist"}),
      ...state.watchlist.map((symbol) => el("option", {value: symbol, text: symbol})));
    symbols.dataset.list = wanted;
    if (state.watchlist.includes(current)) symbols.value = current;
  }
  $("bt-run").disabled = run.running || !state.setup.data || state.watchlist.length === 0;
  $("bt-run").textContent = run.running ? "Running…" : "Run backtest";
  $("bt-bar").className = "bar" + (run.running ? " on" : "");
  $("bt-bar").firstElementChild.style.width = run.total ? (100 * run.done / run.total) + "%" : "0";
  let status = "";
  if (run.running) status = run.message || ("Testing " + (run.current || "…") + " (" + Math.min(run.done + 1, run.total) + " of " + run.total + ")");
  else if (run.error) status = run.error;
  else if (!backtestResult) status = "Replays past prices day by day and trades every signal with its own SL and TP.";
  $("bt-status").textContent = status;
  if (!run.running && run.run !== backtestRun) loadBacktest(run.run);
}

async function loadBacktest(run) {
  backtestRun = run;
  try {
    backtestResult = (await (await fetch("/api/backtest")).json()).result;
  } catch (error) { return; }
  showAllTrades = false;
  renderBacktest();
}

function tile(label, value) {
  return el("div", {class: "tile"}, el("div", {class: "label", text: label}), el("div", {class: "value", text: value}));
}

function renderBacktest() {
  const box = $("bt-results");
  box.replaceChildren();
  const result = backtestResult;
  if (!result) return;
  const total = result.total;
  const options = result.options;
  const period = options.years === 1 ? "last year" : "last " + options.years + " years";

  box.append(el("h2", {text: "By strategy"}));
  const byStrategy = el("table", {}, el("thead", {}, el("tr", {},
    el("th", {text: "Strategy"}), el("th", {text: "Side"}), el("th", {class: "num", text: "Trades"}),
    el("th", {class: "num", text: "Win rate"}), el("th", {class: "num", text: "Avg per trade"}),
    el("th", {class: "num", text: "Total"}), el("th", {class: "num", text: "Profit factor"}),

  const rows = el("tbody");

      el("td", {class: "num", text: String(row.trades)}), el("td", {class: "num", text: row.win_rate.toFixed(0) + "%"}),
      el("td", {class: "num " + (row.avg_r >= 0 ? "up" : "down"), text: signed(row.avg_r) + "R"}),
      el("td", {class: "num " + (row.total_r >= 0 ? "up" : "down"), text: signed(row.total_r, 1) + "R"}),
      el("td", {class: "num", text: row.profit_factor == null ? "–" : row.profit_factor.toFixed(2)}),
      el("td", {class: "num", text: row.avg_days.toFixed(0)})));

  byStrategy.append(rows);
  box.append(el("section", {class: "card"}, el("div", {class: "table-wrap"}, byStrategy)));

  box.append(el("h2", {text: "Trades"}));
  const trades = el("table", {class: "compact"}, el("thead", {}, el("tr", {},

    el("th", {class: "num", text: "Entry"}), el("th", {class: "num", text: "Exit"}), el("th", {text: "Ended by"}),
    el("th", {class: "num", text: "Days"}), el("th", {class: "num", text: "Result"}), el("th", {class: "num", text: "Price move"}))));
  const tradeRows = el("tbody");
  const reasons = {target: "Take profit", stop: "Stop loss", time: "Time limit", open: "Still open"};
  const shown = showAllTrades ? result.trades : result.trades.slice(0, 50);
  for (const trade of shown) {

      el("td", {text: trade.entry_date}), el("td", {class: "sym-cell", text: trade.symbol}),

      el("td", {class: "num", text: trade.entry.toFixed(2)}), el("td", {class: "num", text: trade.exit.toFixed(2)}),
      el("td", {text: reasons[trade.reason]}), el("td", {class: "num", text: String(trade.days)}),
      el("td", {class: "num " + (trade.r >= 0 ? "up" : "down"), text: signed(trade.r) + "R"}),
      el("td", {class: "num", text: signed(trade.pct, 1) + "%"})));
  }
  trades.append(tradeRows);
  const tradesCard = el("section", {class: "card"}, el("div", {class: "table-wrap"}, trades));
  if (result.trades.length > shown.length) {
    const more = el("button", {text: "Show all " + result.trades.length + " trades"});
    more.addEventListener("click", () => { showAllTrades = true; renderBacktest(); });
    tradesCard.append(el("div", {class: "signal"}, more));
  }
  tradesCard.append(el("ul", {class: "notes"},
    el("li", {text: "Each trade enters at the close of the signal day and ends at its SL, at TP" + options.target + ", or after " + options.max_days + " trading days."}),
    el("li", {text: "When SL and TP are both touched on the same day, the SL is assumed to come first."}),
    el("li", {text: "One trade at a time per stock, strategy and side. Commissions, slippage and borrowing costs for shorts are not included."}),
    el("li", {text: "Past results do not predict future results."})));
  box.append(tradesCard);
  drawCurve();
}

function niceStep(span, steps) {
  const raw = span / steps;
  const power = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const factor of [1, 2, 5, 10]) if (raw <= factor * power) return factor * power;
  return 10 * power;
}

function drawCurve() {
  const box = $("bt-chart");
  if (!box || !backtestResult || !backtestResult.curve.length || !box.clientWidth) return;
  const NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs) => {
    const node = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    return node;
  };
  const time = (date) => Date.parse(date + "T00:00:00Z");
  const firstEntry = backtestResult.trades.reduce((min, t) => t.entry_date < min ? t.entry_date : min, backtestResult.curve[0].date);
  const points = [{date: firstEntry, r: 0}, ...backtestResult.curve];
  const width = box.clientWidth, height = 240;
  const pad = {left: 44, right: 12, top: 12, bottom: 24};
  const t0 = time(points[0].date), t1 = Math.max(time(points[points.length - 1].date), t0 + 1);
  let low = Math.min(0, ...points.map((p) => p.r)), high = Math.max(0, ...points.map((p) => p.r));
  const step = niceStep(Math.max(high - low, 1), 4);
  low = Math.floor(low / step) * step; high = Math.ceil(high / step) * step;
  const x = (t) => pad.left + (t - t0) / (t1 - t0) * (width - pad.left - pad.right);
  const y = (r) => pad.top + (high - r) / (high - low) * (height - pad.top - pad.bottom);

  const svg = svgEl("svg", {viewBox: "0 0 " + width + " " + height, role: "img",
    "aria-label": "Cumulative result in R over time. The trades table below lists every value."});
  for (let value = low; value <= high + step / 2; value += step) {
    svg.append(svgEl("line", {class: Math.abs(value) < step / 1e6 ? "zero" : "grid", x1: pad.left, x2: width - pad.right, y1: y(value), y2: y(value)}));
    const label = svgEl("text", {x: pad.left - 8, y: y(value) + 4, "text-anchor": "end"});
    label.textContent = (value > 0 ? "+" : "") + Number(value.toFixed(6)) + "R";
    svg.append(label);
  }
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const ticks = Math.max(2, Math.min(6, Math.floor(width / 130)));
  for (let i = 0; i <= ticks; i++) {
    const t = t0 + (t1 - t0) * i / ticks, d = new Date(t);
    const label = svgEl("text", {x: x(t), y: height - 6, "text-anchor": i === 0 ? "start" : i === ticks ? "end" : "middle"});
    label.textContent = months[d.getUTCMonth()] + " " + d.getUTCFullYear();
    svg.append(label);
  }
  // A step line: the total only changes on the day a trade ends.
  let path = "M" + x(t0) + "," + y(0);
  for (const point of points.slice(1)) path += "H" + x(time(point.date)) + "V" + y(point.r);
  svg.append(svgEl("path", {class: "curve", d: path}));
  const cross = svgEl("line", {class: "cross", y1: pad.top, y2: height - pad.bottom, visibility: "hidden"});
  const dot = svgEl("circle", {class: "dot", r: 5, visibility: "hidden"});
  svg.append(cross, dot);
  const tip = el("div", {class: "tip"});
  box.replaceChildren(svg, tip);

  const hover = (event) => {
    const bounds = svg.getBoundingClientRect();
    const t = t0 + (event.clientX - bounds.left - pad.left) / (width - pad.left - pad.right) * (t1 - t0);
    let point = points[0];   // the last point at or before the pointer
    for (const candidate of points) if (time(candidate.date) <= t) point = candidate;
    const px = x(time(point.date)), py = y(point.r);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("visibility", "visible");
    tip.replaceChildren(el("b", {text: signed(point.r, 1) + "R"}), document.createTextNode("  " + point.date));
    tip.style.display = "block";
    tip.style.left = Math.min(Math.max(px, 70), width - 70) + "px";
    tip.style.top = py + "px";
  };
  svg.addEventListener("pointermove", hover);
  svg.addEventListener("pointerdown", hover);
  svg.addEventListener("pointerleave", () => {
    cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.style.display = "none";
  });
}
window.addEventListener("resize", drawCurve);

function banner(before, code, after) {
  return el("div", {class: "banner"}, document.createTextNode(before), el("code", {text: code}), document.createTextNode(after));
}

function plural(count, word) { return count + " " + word + (count === 1 ? "" : "s"); }

function entryCard(row, entry) {
  const card = el("section", {class: "card entry"});
  const change = row.change_pct;
  card.append(el("div", {class: "entry-head"},
    el("span", {class: "sym", text: row.symbol}),
    el("span", {class: "side " + entry.direction, text: entry.direction === "short" ? "SHORT" : "LONG"}),
    el("span", {class: "price", text: money(row.price)}),
    el("span", {class: "price " + (change >= 0 ? "up" : "down"), text: percent(change)}),
    el("span", {class: "small", text: "candle of " + row.date})));
  if (entry.plan) {
    const levels = el("div", {class: "levels"});
    for (const level of entry.plan.levels) {
      const kind = level.label === "SL" ? " sl" : level.label.startsWith("TP") ? " tp" : "";
      levels.append(el("div", {class: "level" + kind},
        el("div", {class: "label", text: level.label}),
        el("div", {class: "value", text: level.price}),
        el("div", {class: "small", text: level.pct || " "})));
    }
    card.append(levels, el("div", {class: "small", text: entry.plan.note}));
  }
  for (const signal of entry.signals) {
    card.append(el("div", {class: "signal"},
      el("div", {class: "title"}, document.createTextNode(signal.title),
        el("span", {class: "badge" + (signal.new ? " new" : ""), text: signal.new ? "new" : "already emailed"})),
      el("div", {text: signal.reason})));
  }
  const facts = el("div", {class: "facts"});
  for (const [label, value] of Object.entries(row.facts)) {
    facts.append(el("span", {}, document.createTextNode(label + " "), el("b", {text: value})));
  }
  card.append(facts, el("div", {class: "signal"},
    el("a", {href: "https://finance.yahoo.com/chart/" + encodeURIComponent(row.symbol), target: "_blank", rel: "noopener", text: "Open chart"})));
  return card;
}

// Remember the email choice in this browser; default to on.

  try { return localStorage.getItem("trader-email") !== "off"; } catch (error) { return true; }
}

$("email").addEventListener("change", () => {
  try { localStorage.setItem("trader-email", $("email").checked ? "on" : "off"); } catch (error) {}
});

showTab(startTab);
$("strategy").addEventListener("change", saveSelection);
$("direction").addEventListener("change", saveSelection);
$("bt-run").addEventListener("click", async () => {
  $("bt-run").disabled = true;
  const result = await post("/api/backtest", {
    strategy: $("bt-strategy").value, direction: $("bt-direction").value, symbol: $("bt-symbol").value,
    years: Number($("bt-years").value), target: Number($("bt-target").value), max_days: Number($("bt-days").value),
  });

});
$("auto").addEventListener("change", async () => {
  await post("/api/auto", {enabled: $("auto").checked, interval: Number($("interval").value)});
  refresh();
});
$("interval").addEventListener("change", async () => {
  $("interval").blur();
  await post("/api/auto", {enabled: $("auto").checked, interval: Number($("interval").value)});
  refresh();
});
$("add-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const symbol = $("add-input").value.trim();
  if (!symbol) return;
  const result = await post("/api/watchlist/add", {symbol});
  $("add-error").textContent = result.error || "";

});

refresh();
